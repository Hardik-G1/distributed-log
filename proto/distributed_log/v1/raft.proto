syntax="proto3";

package distributed_log.v1;
import "distributed_log/v1/lock.proto";

option go_package="github.com/Hardik-G1/distributed-log/gen/distributed_log/v1;distributedlogv1";


message RequestVoteRequest{
    int64 vote_term=1;
    int64 candidate_log_index=2;
    int64 candidate_last_log_term=3;
    string candidate_id=4;
    int64 candidate_requested_at=5;
}
enum Vote{
    VOTE_UNSPECIFIED=0;
    VOTE_GRANTED=1;
    VOTE_REJECTED=2;
}

message RequestVoteResponse{
    int64 vote_term=1;
    string voter_id=2;
    Vote vote_status=3;
}

message PreVoteRequest{
    int64 vote_term=1;
    int64 candidate_log_index=2;
    int64 candidate_last_log_term=3;
    string candidate_id=4;
    int64 candidate_requested_at=5;
}
message PreVoteResponse{
    int64 vote_term=1;
    string voter_id=2;
    Vote vote_status=3;
}
enum Operation{
    OPERATION_UNSPECIFIED=0;
    OPERATION_ACQUIRE_LOCK=1;
    OPERATION_RELEASE_LOCK=2;
    OPERATION_APPEND_LOG=3;
    OPERATION_NOOP=4;
}
message LogEntry{
    int64 term=1; // repeated here again as it can be different for old
    Operation operation_type=2;
    bytes operation_payload=3;
}


message AppendEntriesRequest{
    string sender_id=1; // to know where the request came from and to reject if not a leader
    int64 prev_log_index=2; // to know what was the previous log_entry position whether we are latest or not
    int64 prev_log_term=3; // to know what was the term for the last log entry to know whether we need to update the term
    repeated LogEntry entries=4; // the actual entries
    int64 leader_term=5; // the current term with the entries
    int64 leader_commit_index=6; //where highest index committed to know which are events are safe to commit or not (append and commit are different)
    int64 request_sent_at=7; //for logging
}

enum AppendResponse{
    APPEND_RESPONSE_UNSPECIFIED=0;
    APPEND_RESPONSE_SUCCESS=1;
    APPEND_RESPONSE_OLD_TERM=2;
    APPEND_RESPONSE_LOG_MISMATCH=3;
}

message AppendEntriesResponse{
    int64 match_index=1;
    int64 latest_appended_term=2;
    int64 current_term=3;
    AppendResponse append_status=4;
}

message InstallSnapshotRequest{
    string leader_id=1;
    int64 current_term=2;
    int64 last_included_index=3;
    int64 last_included_term=4;
    int64 offset=5;
    bytes data=6;
    bool done=7;
}

enum SnapshotStatus{
    SNAPSHOT_STATUS_UNSPECIFIED=0;
    SNAPSHOT_STATUS_ACCEPTED=1;
    SNAPSHOT_STATUS_REJECTED=2;
    SNAPSHOT_STATUS_OLD_TERM=3;
    SNAPSHOT_STATUS_BAD_INDEX=4;
    SNAPSHOT_STATUS_INSTALLED=5;
}
message InstallSnapshotResponse{
    int64 term=1;
    SnapshotStatus status=2;
}


message AcquireLockCommand{
    AcquireLockRequest request=1;
    string lock_token=2;
    int64 expiry=3;
    int64 observed_at=4;
}

message ReleaseLockCommand{
    ReleaseLockRequest request=1;
    int64 observed_at=2;
}
message AppendLogCommand{
    AppendLogRequest request=1;
    int64 observed_at=2;
}
message StoredRaftLog{
    int64 log_index=1;
    int64 term=2;
    Operation operation_type=3;
    bytes operation_payload=4;
}

message StoredRaftMetadata{
    int64 current_term=1;
    string voted_for=2;
}

message StoredRaftSnapshot{
    string snapshot_id=1;
    int64 last_included_index=2;
    int64 last_included_term=3;
    string location=4;
    int64 created_at_unix_nano=5;
}

message StoredCurrentLock{
    string resource_id=1;
    string owner_id=2;
    string request_id=3;
    string lock_token=4;
    int64 expiry=5;
}

message StoredProcessedRequest{
    string client_id=1;
    string request_id=2;
    string resource_id=3;
    bytes response=4;
    int64 created_at_unix_nano=5;
}
message StoredResourceLocation{
    string resource_id=1;
    string location=2;
}

message StoredApplicationLog{
    string resource_id=1;
    repeated string messages=2;
}
message MemoryApplicationStateSnapshot{
    uint32 version=1;
    repeated StoredCurrentLock current_locks=2;
    repeated StoredProcessedRequest processed_requests=3;
    repeated StoredResourceLocation resource_locations=4;
    repeated StoredApplicationLog logs=5;
    int64 last_applied_index=6;
}

service RaftService{
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
    rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
    rpc PreVote(PreVoteRequest) returns (PreVoteResponse);
}
